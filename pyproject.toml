[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "neural-cutting-stock"
version = "0.1.0"
description = "Learning to accelerate column generation for the one-dimensional cutting stock problem"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Neural Cutting Stock contributors" },
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
benchmark = [
  "matplotlib>=3.8,<4",
  "pandas>=2.2,<4",
]
dev = [
  "matplotlib>=3.8,<4",
  "pandas>=2.2,<4",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neural_cutting_stock"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["neural_cutting_stock"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
